function getFilteredIndices() {
  const isOrg = A.role === 'org', R = isOrg ? (A.OR || {}) : (A.R || {});
  const baseCi = getBaseCompletedIndices();
  if (!baseCi.length) return baseCi;

  const firstW = String(R.weeks[baseCi[0]]);
  const lastWEnd = addDaysIso(R.weeks[baseCi[baseCi.length - 1]], 6);

  const f = A.rtFrom ? String(A.rtFrom) : firstW;
  const t = A.rtTo ? String(A.rtTo) : lastWEnd;
  const lo = f <= t ? f : t;
  const hi = f <= t ? t : f;

  const matched = baseCi.filter(function (ci) {
    const wStart = String(R.weeks[ci]);
    const wEnd = addDaysIso(wStart, 6);
    return wEnd >= lo && wStart <= hi;
  });

  if (matched.length) return matched;

  /* إذا اختار المستخدم تاريخاً لا يطابق أسبوعاً مكتملاً بعد، نسحب أقرب أسبوع مكتمل لذلك التاريخ */
  let closest = baseCi[baseCi.length - 1], minDiff = Infinity;
  const targetMs = Date.parse(lo) || 0;
  baseCi.forEach(function (ci) {
    const wMs = Date.parse(String(R.weeks[ci])) || 0;
    const diff = Math.abs(wMs - targetMs);
    if (diff < minDiff) { minDiff = diff; closest = ci; }
  });
  return [closest];
}

function getTimeFilterLabel() {
  const isOrg = A.role === 'org', R = isOrg ? (A.OR || {}) : (A.R || {});
  const cIdxs = getFilteredIndices();
  if (!cIdxs.length) return 'لا أسابيع مكتملة';
  if (cIdxs.length === 1) {
    const w = String(R.weeks[cIdxs[0]]);
    return 'أسبوع ' + w + ' (إلى ' + addDaysIso(w, 6) + ')';
  }
  const w1 = String(R.weeks[cIdxs[0]]);
  const w2 = String(R.weeks[cIdxs[cIdxs.length - 1]]);
  return 'من أسبوع ' + w1 + ' إلى ' + w2 + ' (' + cIdxs.length + ' أسابيع)';
}

/* حساب البنود الـ 14 عبر الأسابيع المسحوبة في النطاق الزمني */
function oItems(u) {
  const R = A.OR;
  if (!R || !R.ci || !R.ci.length || !u || !u.n) return null;
  const cIdxs = R.ci;
  return (R.items || []).map(function (it) {
    const a = (u.gi || {})[String(it.id)];
    let sum = 0;
    cIdxs.forEach(function (idx) { sum += ((a && a[idx]) || 0); });
    return { id: it.id, title: it.title, cat: it.cat || 'أخرى', pct: Math.round(100 * sum / (u.n * cIdxs.length)) };
  });
}

function wrItems(sc) {
  if (!sc || !sc.itemsOk || !A.rci || !A.rci.length) return null;
  const R = A.R, x = wrIdx(), cIdxs = A.rci;
  let den = 0;
  sc.gids.forEach(function (g) { den += (x.mg[g] || []).length; });
  if (!den) return null;
  return (R.items || []).map(function (it) {
    let n = 0;
    cIdxs.forEach(function (idx) {
      sc.gids.forEach(function (g) {
        const a = ((R.gi || {})[String(g)] || {})[String(it.id)];
        n += (a && a[idx]) || 0;
      });
    });
    return { id: it.id, title: it.title, cat: it.cat || 'أخرى', pct: Math.round(100 * n / (den * cIdxs.length)) };
  });
}

/* رسم بياني مخصص لتطور المستوى الأسبوعي (أعمدة + منحنى الارتفاع والهبوط لكل أسبوع في الفترة) */
function svgWeeklyProgression(ws, ser, sentSer, mName, unitName) {
  if (!ws || !ws.length) return svgNone('لا تتوفر أسابيع في هذه الفترة.');
  const n = ws.length;
  const W = Math.max(420, n * 78 + 60), H = 205, L = 36, T = 26, B = 48, E = 18;
  const plotW = W - L - E, plotH = H - T - B, step = plotW / n, bw = Math.min(36, Math.max(16, step * 0.48));
  const Y = function (p) { return T + plotH * (1 - svgCl(p) / 100); };
  let g = '';
  [0, 25, 50, 75, 100].forEach(function (v) {
    g += '<line x1="' + L + '" x2="' + (W - E) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="#e2ece5" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (Y(v) + 3).toFixed(1) + '" font-size="9" fill="#6b7d71" text-anchor="end">' + v + '%</text>';
  });

  const linePts = [];
  ws.forEach(function (w, i) {
    const p = svgCl(ser[i] || 0), cx = L + step * (i + 0.5), x = cx - bw / 2, y = Y(p), h = Math.max(3, T + plotH - y);
    const diff = i > 0 ? (p - svgCl(ser[i - 1] || 0)) : 0;
    const diffTxt = i === 0 ? '' : (diff > 0 ? '▲+' + diff : diff < 0 ? '▼' + diff : '＝0');
    const diffCol = diff > 0 ? '#0b6b3a' : diff < 0 ? '#b3402a' : '#64748b';
    linePts.push(cx.toFixed(1) + ',' + y.toFixed(1));

    g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="5" fill="' + svgCol(p) + '" opacity="0.88"><title>أسبوع ' + esc(String(w)) + ': ' + p + '%</title></rect>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" font-size="10" font-weight="bold" fill="#064e2b" text-anchor="middle">' + p + '%</text>' +
      (diffTxt ? '<text x="' + cx.toFixed(1) + '" y="' + (H - 22).toFixed(1) + '" font-size="9" font-weight="bold" fill="' + diffCol + '" text-anchor="middle">' + diffTxt + '</text>' : '') +
      '<text x="' + cx.toFixed(1) + '" y="' + (H - 8).toFixed(1) + '" font-size="9.5" font-weight="600" fill="#1e293b" text-anchor="middle">' + esc(String(w).slice(5)) + '</text>';
  });

  if (n >= 2) {
    g += '<polyline points="' + linePts.join(' ') + '" fill="none" stroke="#064e2b" stroke-width="2.2" stroke-dasharray="3 2"/>';
    ws.forEach(function (w, i) {
      const p = svgCl(ser[i] || 0), cx = L + step * (i + 0.5), y = Y(p);
      g += '<circle cx="' + cx.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="#fff" stroke="#064e2b" stroke-width="2"/>';
    });
  }

  return '<div style="direction:ltr;overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="min-width:' + Math.min(W, 380) + 'px" role="img" aria-label="تطور المستوى الأسبوعي">' + g + '</svg></div>' +
    '<div class="muted" style="margin-top:4px;font-size:.8rem">يوضح ارتفاع أو هبوط مستوى <b>' + esc(unitName || 'النطاق المحدد') + '</b> في كل أسبوع ضمن الفترة المختارة (مع فارق النقاط عن الأسبوع الذي قبله).</div>';
}

function setRepDate(field, val) {

  repRefreshUI();
}

function resetRepDates() {
  repInit();
  const isOrg = A.role === 'org', R = isOrg ? (A.OR || {}) : (A.R || {});
  const baseCi = getBaseCompletedIndices();
  if (baseCi.length) {
    A.rtFrom = String(R.weeks[baseCi[0]]);
    A.rtTo = addDaysIso(R.weeks[baseCi[baseCi.length - 1]], 6);
  } else {
    A.rtFrom = ''; A.rtTo = '';
  }
  repRefreshUI();
}

function setRepChartSel(val) {
  repInit();
  A.rChartSel = val;
  const m = document.getElementById('rep-main');
  if (m) m.innerHTML = repMain();
}

function setRepMetric(m) {
  if (A.role === 'org') A.om = m; else A.rm = m;
  const el = document.getElementById('rep-main');
  if (el) el.innerHTML = repMain();
}

function repRefreshUI() {
  const p = document.getElementById('rep-ctrl-panel');

  if (m) m.innerHTML = repMain();
}

      '<span class="muted" style="font-size:.82rem">إلى</span>' +

      '<button class="link sm" style="font-size:.78rem;padding:2px 6px" title="إظهار كل الأسابيع" onclick="resetRepDates()">الكل</button>' +
    '</div>' +

    /* 2) القائمة المنسدلة للرسوم البيانية + المقياس */
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<label style="display:flex;align-items:center;gap:5px;font-size:.86rem;color:var(--g1)"><b>الرسم البياني:</b>' +
        '<select onchange="setRepChartSel(this.value)" style="width:auto;min-width:210px;padding:5px 10px;min-height:34px;font-size:.85rem">' +
          chartOpts.map(function (o) { return '<option value="' + o[0] + '"' + (A.rChartSel === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') +
        '</select>' +
      '</label>' +
      '<label style="display:flex;align-items:center;gap:5px;font-size:.86rem;color:var(--g1)"><b>المقياس:</b>' +
        '<select onchange="setRepMetric(this.value)" style="width:auto;padding:5px 10px;min-height:34px;font-size:.85rem">' +

      '<button class="sm" style="background:var(--g1);font-weight:700;min-height:34px;padding:5px 12px" onclick="repExportPDF()">تصدير PDF</button>' +

}

function oCharts(s, rp) {
  const R = A.OR || {}, u = s.u;
  const sel = (A.tab === 'reports' && A.rChartSel) ? A.rChartSel : 'all';
  if (sel === 'none') return '';

  const sentSer = oSer(u, 'sent');
  const timeLbl = getTimeFilterLabel();
  const showAll = (sel === 'all');

  const unitList = (rp.rows || []).filter(function (r) { return r.u && r.u.u && r.u.u.n; }).map(function (r) {
    const avgP = r.s && r.s.length ? Math.round(r.s.reduce(function (a, b) { return a + b; }, 0) / r.s.length) : 0;
    return { label: r.u.name, pct: avgP, last: r.last, sub: (r.u.u.n || 0) + ' عضو', ser: r.s };
  }).sort(function (a, b) { return b.pct - a.pct; });

  let out = '<h3>الرسوم البيانية والمقارنات (' + esc(timeLbl) + ')</h3>';

  /* 1) مسار الصعود والهبوط الأسبوعي عبر الزمن (لوحدة محددة أو للنطاق) */
  if (showAll || sel === 'trend') {
    const progChart = svgWeeklyProgression(rp.ws, rp.ser, sentSer, rp.mName, s.name);
    let subTrends = '';
    /* إذا كان هناك فرع واحد محدد أو عدة وحدات محددة في وضع trend، نعرض أيضاً مسار كل وحدة/مجموعة تحتها */
    if (sel === 'trend' && rp.rows && rp.rows.length >= 1 && rp.rows.length <= 8 && rp.ws.length >= 2) {
      subTrends = '<div class="row" style="align-items:stretch;margin-top:10px">' +
        rp.rows.map(function (r) {
          return svgCard('مسار تطور: ' + r.u.name + ' (عبر الأسابيع)', svgWeeklyProgression(rp.ws, r.s, null, rp.mName, r.u.name), 340);
        }).join('') + '</div>';
    }
    out += '<div class="row" style="align-items:stretch;margin-top:8px">' +
      svgCard('تطور المستوى الأسبوعي — الصعود والهبوط (' + esc(s.name) + ')', progChart, 380) +
      (showAll ? svgCard('المنحنى التطوري المزدوج (التنفيذ والإرسال)', svgTimeline(rp.ws, rp.ser, sentSer, rp.mName, A.om !== 'sent'), 280) : '') +
    '</div>' + subTrends;
  }

  /* 2) الأعمدة العمودية + الأشرطة الجانبية الأفقية للمقارنة */
  if (showAll || sel === 'cols' || sel === 'hbars') {
    const rowCmp = [];
    if (showAll || sel === 'cols') {
      const unitTitle = s.kind === 'o' ? 'أعمدة مقارنة الفروع' : s.kind === 'b' ? 'أعمدة مقارنة مجموعات الفرع' : 'أعمدة مقارنة الوحدات المحددة';
      rowCmp.push(svgCard(unitTitle + ' (' + timeLbl + ')', svgColumns(unitList, s.kind === 'g' ? 'المجموعة هي أدنى مستوى مسموح للمسؤول العام.' : 'لا وحدات فرعية للمقارنة.'), 340));
    }
    if (showAll || sel === 'hbars') {
      rowCmp.push(svgCard('الأشرطة الجانبية الأفقية للمقارنة (' + timeLbl + ')', svgHBars(unitList, s.kind === 'g' ? 'المجموعة هي أدنى مستوى مسموح للمسؤول العام.' : 'لا وحدات فرعية للمقارنة.'), 320));
    }
    out += '<div class="row" style="align-items:stretch;margin-top:10px">' + rowCmp.join('') + '</div>';
  }

  /* 3) دائرة الإرسال + الأقسام الخمسة + مقارنة الفترات */
  if (showAll || sel === 'donut' || sel === 'cats' || sel === 'periods') {
    const rowMid = [];
    if (showAll || sel === 'donut') {
      let dn;
      if (!sentSer.length || !(u.n || 0)) dn = svgNone('لا يوجد أسبوع مكتمل بعد.');
      else {
        const cIdxs = R.ci || [];
        let sumS = 0;
        cIdxs.forEach(function (ci) { sumS += ((u.s || [])[ci] || 0); });
        const avgSentCount = cIdxs.length ? Math.round(sumS / cIdxs.length) : 0;
        const avgSentPct = sentSer.length ? Math.round(sentSer.reduce(function (a, b) { return a + b; }, 0) / sentSer.length) : 0;
        dn = svgDonut(avgSentPct, avgSentCount, u.n || 0);
      }
      rowMid.push(svgCard('المُرسِل وغير المُرسِل (' + timeLbl + ')', dn, 250));
    }
    if (showAll || sel === 'cats') {
      const its = oItems(u), cs = its && its.length ? wrCats(its).slice().sort(function (a, b) { return b.pct - a.pct; }) : [];
      rowMid.push(svgCard('توزيع الأقسام الخمسة (' + timeLbl + ')', svgHBars(cs.map(function (c) { return { label: c.cat, pct: c.pct }; }), 'لا بيانات للأقسام بعد.'), 260));
    }
    if (showAll || sel === 'periods') {
      rowMid.push(svgCard('مقارنة الفترات الشهرية (الأشهر)', renderPeriodComparison(rp.ws, rp.ser, sentSer, rp.mName), 320));
    }
    out += '<div class="row" style="align-items:stretch;margin-top:10px">' + rowMid.join('') + '</div>';
  }

  /* 4) تفصيل البنود الـ 14 */
  if (showAll || sel === 'items') {
    const its = oItems(u);
    const sortedItems = its && its.length ? its.slice().sort(function (a, b) { return b.pct - a.pct; }) : [];
    const itemsBars = svgHBars(sortedItems.map(function (it) { return { label: it.title, sub: it.cat, pct: it.pct }; }), 'لا بيانات للبنود في هذا النطاق.');
    out += '<div class="row" style="align-items:stretch;margin-top:10px">' + svgCard('تفصيل البنود الأربعة عشر (' + timeLbl + ' — مرتبة تنازلياً)', itemsBars, 320) + '</div>';
  }

  return out;
}

function repTree() {
  const q = typeof wrNorm === 'function' ? wrNorm(A.rq) : (A.rq || '').trim().toLowerCase();

  };

      const bgs = (R.groups || []).filter(function (g) { return g.branch_id === b.id; });
      const gm = bgs.some(function (g) { return (g.name || '').toLowerCase().indexOf(q) >= 0; });
      if (q && !bm && !gm) return;

      const bSel = !!A.rsel['b:' + b.id];
      const bOpen = !!A.rexp['b:' + b.id] || (!!q && gm);
      h += '<div style="display:flex;align-items:center;gap:4px;margin-top:6px">' + tg('b:' + b.id, bOpen, bgs.length > 0) + cb('b:' + b.id, b.name, '(' + (b.n || 0) + ')', false, bm) + '</div>';

      if (bOpen && bgs.length) {
        h += '<div style="margin-right:22px; border-right:1px dashed #c9d3cc; padding-right:6px">';
        bgs.forEach(function (g) {
          const gpm = !q || (g.name || '').toLowerCase().indexOf(q) >= 0;
          if (q && !bm && !gpm) return;
          h += '<div style="display:flex;align-items:center;gap:4px">' + tg('g:' + g.id, false, false) + cb('g:' + g.id, g.name, '(' + (g.n || 0) + ')', bSel, gpm) + '</div>';
        });
        h += '</div>';
      }
    });
  } else {
    const x = typeof wrIdx === 'function' ? wrIdx() : null;
    if (!x) return '';
    (R.branches || []).forEach(function (b) {
      const bm = !q || (b.name || '').toLowerCase().indexOf(q) >= 0;
      const bgs = x.bg[b.id] || [];
      const gm = bgs.some(function (g) { return (g.name || '').toLowerCase().indexOf(q) >= 0; });
      const mm = bgs.some(function (g) { return (x.mg[g.id] || []).some(function (m) { return (m.name || '').toLowerCase().indexOf(q) >= 0; }); });
      if (q && !bm && !gm && !mm) return;

      const bSel = !!A.rsel['b:' + b.id];
      const bOpen = !!A.rexp['b:' + b.id] || (!!q && (gm || mm));
      const bn = bgs.reduce(function (s, g) { return s + (x.mg[g.id] || []).length; }, 0);

      h += '<div style="display:flex;align-items:center;gap:4px;margin-top:6px">' + tg('b:' + b.id, bOpen, bgs.length > 0) + cb('b:' + b.id, b.name, '(' + bn + ')', false, bm) + '</div>';

      if (bOpen && bgs.length) {
        h += '<div style="margin-right:22px; border-right:1px dashed #c9d3cc; padding-right:6px">';
        bgs.forEach(function (g) {
          const gpm = !q || (g.name || '').toLowerCase().indexOf(q) >= 0;
          const ms = x.mg[g.id] || [];
          const gmm = ms.some(function (m) { return (m.name || '').toLowerCase().indexOf(q) >= 0; });
          if (q && !bm && !gpm && !gmm) return;

          const gSel = bSel || !!A.rsel['g:' + g.id];
          const gOpen = !!A.rexp['g:' + g.id] || (!!q && gmm);

          h += '<div style="display:flex;align-items:center;gap:4px">' + tg('g:' + g.id, gOpen, ms.length > 0) + cb('g:' + g.id, g.name, '(' + ms.length + ')', bSel, gpm) + '</div>';

          if (gOpen && ms.length) {
            h += '<div style="margin-right:22px; border-right:1px dashed #c9d3cc; padding-right:6px">';
            ms.forEach(function (m) {
              const mpm = !q || (m.name || '').toLowerCase().indexOf(q) >= 0;
              if (q && !bm && !gpm && !mpm) return;
              h += '<div style="display:flex;align-items:center;gap:4px">' + tg('m:' + m.id, false, false) + cb('m:' + m.id, m.name, '', gSel, mpm) + '</div>';
            });
            h += '</div>';
          }
        });
        h += '</div>';
      }
    });
  }
  return h || '<div class="muted" style="padding:10px">لا توجد نتائج مطابقة</div>';
}

function makeOrgCustomUnit(keys) {
  const R = A.OR || {}, wLen = (R.weeks || []).length;
  const selB = {}, units = [];
  keys.forEach(function (k) { if (k.indexOf('b:') === 0) selB[k.slice(2)] = 1; });
  keys.forEach(function (k) {
    if (k.indexOf('g:') === 0) {
      const gid = Number(k.slice(2));
      const g = (R.groups || []).filter(function (x) { return x.id === gid; })[0];
      if (g && selB[String(g.branch_id)]) return;
    }
    const u = oUnit(k);
    if (u && u.u) units.push(u);
  });
  const agg = { n: 0, d: new Array(wLen).fill(0), s: new Array(wLen).fill(0), gi: {} };
  units.forEach(function (item) {
    const u = item.u;
    agg.n += (u.n || 0);
    for (let i = 0; i < wLen; i++) {
      agg.d[i] += ((u.d || [])[i] || 0);
      agg.s[i] += ((u.s || [])[i] || 0);
    }
    Object.keys(u.gi || {}).forEach(function (itId) {
      if (!agg.gi[itId]) agg.gi[itId] = new Array(wLen).fill(0);
      const arr = u.gi[itId] || [];
      for (let i = 0; i < wLen; i++) agg.gi[itId][i] += (arr[i] || 0);
    });
  });
  const title = units.slice(0, 3).map(function (u) { return '«' + u.name + '»'; }).join('، ') + (units.length > 3 ? ' (+' + (units.length - 3) + ')' : '');
  return { k: 'custom', kind: 'custom', name: 'مقارنة مخصصة: ' + title, u: agg, rowsUnits: keys.map(function (k) { return oUnit(k); }).filter(Boolean) };
}

function getExportContext(sourceMode) {
  repInit();
  const isWrTab = (sourceMode === 'wr_tab');
  const activeCi = isWrTab ? getBaseCompletedIndices() : getFilteredIndices();
  const timeLabel = isWrTab ? ('جميع الأسابيع المكتملة (' + activeCi.length + ')') : getTimeFilterLabel();
  const selChart = isWrTab ? 'all' : (A.rChartSel || 'all');

  let rp, title, totN = 0, itemsList = null, catsList = [], sentSer = [], periodStats = [], scopeKind = 'o';
  const keys = Object.keys(A.rsel || {}).filter(function (k) { return A.rsel[k]; });

  if (A.role === 'org') {
    const old_oKids = window.oKids, old_oUnit = window.oUnit, old_ci = A.OR.ci;
    A.OR.ci = activeCi;
    let s;
    if (isWrTab) {
      s = oUnit(A.ok) || oUnit('o');
    } else if (keys.length === 0) {
      s = oUnit('o');
    } else if (keys.length === 1) {
      s = oUnit(keys[0]) || oUnit('o');
    } else {
      s = makeOrgCustomUnit(keys);
      window.oUnit = function (k) { return k === 'custom' ? s : old_oUnit(k); };
      window.oKids = function () { return s.rowsUnits; };
    }
    scopeKind = s.kind || 'o';
    rp = oRep(s);
    title = s.name;
    totN = (s.u && s.u.n) || 0;
    sentSer = oSer(s.u, 'sent');
    itemsList = oItems(s.u);
    catsList = itemsList && itemsList.length ? wrCats(itemsList).sort(function (a, b) { return b.pct - a.pct; }) : [];
    const baseCi = getBaseCompletedIndices();
    const baseWs = baseCi.map(function (i) { return A.OR.weeks[i]; });
    A.OR.ci = baseCi;
    const fullSer = oSer(s.u, A.om || 'exec'), fullSent = oSer(s.u, 'sent');
    periodStats = calcPeriodStats(baseWs, fullSer, fullSent);
    window.oKids = old_oKids; window.oUnit = old_oUnit; A.OR.ci = old_ci;
  } else {
    const old_rci = A.rci;
    A.rci = activeCi;
    const sc = wrScope();
    rp = wrReport(sc);
    title = rp.scopeName;
    totN = rp.nM || 0;
    sentSer = wrSer(sc.ms, 'sent');
    itemsList = wrItems(sc);
    catsList = itemsList && itemsList.length ? wrCats(itemsList).sort(function (a, b) { return b.pct - a.pct; }) : [];
    const baseCi = getBaseCompletedIndices();
    const baseWs = baseCi.map(function (i) { return A.R.weeks[i]; });
    A.rci = baseCi;
    const fullSer = wrSer(sc.ms, A.rm || 'exec'), fullSent = wrSer(sc.ms, 'sent');
    periodStats = calcPeriodStats(baseWs, fullSer, fullSent);
    A.rci = old_rci;
    scopeKind = sc.all ? 'b' : 'custom';
  }
  return {
    rp: rp, title: title, totN: totN, itemsList: itemsList, catsList: catsList,
    sentSer: sentSer, periodStats: periodStats, scopeKind: scopeKind, keys: keys,
    timeLabel: timeLabel, selChart: selChart, activeCi: activeCi
  };
}

    const row = [mkC(r.name || r.u.name, 's', stTdR), mkC(knd, 's', stTdC), mkC(n, 'n', stTdNum)];
    r.s.forEach(function (p) { row.push(mkC((Number(p) || 0) / 100, 'n', stPctCell(p, false))); });
    row.push(mkC(avg / 100, 'n', stPctCell(avg, true)));
    row.push(mkC(diff / 100, 'n', stDiffCell(diff)));
    rows1.push(row); rowH1.push({ hpt: 21 });
  });

  const totAvg = rp.ser.length ? Math.round(rp.ser.reduce(function (a, b) { return a + b; }, 0) / rp.ser.length) : 0;
  const totDiff = rp.ser.length >= 2 ? (rp.ser[rp.ser.length - 1] - rp.ser[rp.ser.length - 2]) : 0;
  const totRow = [mkC('إجمالي النطاق (' + title + ')', 's', stTotR), mkC('إجمالي', 's', stTotNum), mkC(totN, 'n', stTotNum)];
  rp.ser.forEach(function (p) { totRow.push(mkC((Number(p) || 0) / 100, 'n', stTotPct)); });
  totRow.push(mkC(totAvg / 100, 'n', stTotPct));
  totRow.push(mkC(totDiff / 100, 'n', stTotPct));
  rows1.push(totRow); rowH1.push({ hpt: 24 });

  rows1.push([]); rowH1.push({ hpt: 14 });

  addFullRow1('المؤشرات الرئيسية للنطاق', stSec, 26);
  const sentAvg = ctx.sentSer.length ? Math.round(ctx.sentSer.reduce(function (a, b) { return a + b; }, 0) / ctx.sentSer.length) : 0;
  const kpiList = [
    ['إجمالي الأعضاء في النطاق', totN, 'n', stTdNum],
    ['عدد الوحدات المقارَنة', rs.length, 'n', stTdNum],
    ['متوسط ' + rp.mName + ' (' + ctx.timeLabel + ')', (rp.avg || 0) / 100, 'n', stPctCell(rp.avg || 0, true)],
    [rp.mName + ' في آخر أسبوع ضمن الفترة', (rp.last || 0) / 100, 'n', stPctCell(rp.last || 0, true)],
    ['متوسط نسبة الإرسال في الفترة', sentAvg / 100, 'n', stPctCell(sentAvg, false)]
  ];
  kpiList.forEach(function (k) {
    rows1.push([mkC(k[0], 's', stTdR), mkC(k[1], k[2], k[3])]);
    rowH1.push({ hpt: 20 });
  });

  rows1.push([]); rowH1.push({ hpt: 14 });

  addFullRow1('القراءة الذكية والتحليل التنفيذي', stSec, 26);
  (rp.lines || []).forEach(function (l) { addFullRow1('•  ' + l, stBullet, 21); });
  (rp.strong || []).forEach(function (s) {
    addFullRow1('▲  قوة: ' + s, { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: '0B6B3A' } }, alignment: { horizontal: 'right', vertical: 'center' } }, 21);
  });
  (rp.weak || []).forEach(function (w) {
    addFullRow1('▼  فرصة تحسين: ' + w, { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'B3402A' } }, alignment: { horizontal: 'right', vertical: 'center' } }, 21);
  });

  if (ctx.periodStats && ctx.periodStats.length) {
    rows1.push([]); rowH1.push({ hpt: 14 });
    addFullRow1('مقارنة الفترات الشهرية (الأشهر)', stSec, 26);
    rows1.push([mkC('الفترة', 's', stThR), mkC('النطاق الزمني', 's', stThC), mkC('الأسابيع المكتملة', 's', stThC), mkC('متوسط ' + rp.mName, 's', stThC), mkC('متوسط الإرسال', 's', stThC)]);
    rowH1.push({ hpt: 24 });
    ctx.periodStats.forEach(function (ps) {
      rows1.push([
        mkC(ps.label, 's', stTdR),
        mkC(ps.range, 's', stTdC),
        mkC(ps.weeks, 'n', stTdNum),
        mkC((ps.pct || 0) / 100, 'n', stPctCell(ps.pct, true)),
        mkC((ps.sentPct || 0) / 100, 'n', stPctCell(ps.sentPct, false))
      ]);
      rowH1.push({ hpt: 21 });
    });
  }

  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  ws1['!merges'] = merges1;
  ws1['!rows'] = rowH1;
  ws1['!cols'] = [{ wch: 38 }, { wch: 14 }, { wch: 14 }].concat(wsDates.map(function () { return { wch: 14 }; })).concat([{ wch: 16 }, { wch: 15 }]);
  ws1['!views'] = [{ rightToLeft: true }];
  ws1['!pageSetup'] = { orientation: 'landscape', paperSize: 9 };

  /* الورقة 2: الأقسام والبنود الـ14 */
  const rows2 = [], merges2 = [], rowH2 = [];
  const addFullRow2 = function (text, style, h) {
    const rIdx = rows2.length;
    rows2.push([mkC(text, 's', style), mkC('', 's', style), mkC('', 's', style), mkC('', 's', style)]);
    merges2.push({ s: { r: rIdx, c: 0 }, e: { r: rIdx, c: 3 } });
    rowH2.push({ hpt: h || 22 });
  };

  addFullRow2('تحليل الأقسام الخمسة والبنود الأربعة عشر — ' + title, stTitle, 30);
  addFullRow2('الفترة: ' + ctx.timeLabel + ' | إجمالي الأعضاء: ' + totN, stMeta, 20);
  rows2.push([]); rowH2.push({ hpt: 12 });

  addFullRow2('أولاً: أداء الأقسام الخمسة (مرتبة تنازلياً)', stSec, 26);
  rows2.push([mkC('م', 's', stThC), mkC('القسم', 's', stThR), mkC('عدد البنود', 's', stThC), mkC('نسبة التنفيذ', 's', stThC)]);
  rowH2.push({ hpt: 24 });

  if (ctx.catsList && ctx.catsList.length) {
    ctx.catsList.forEach(function (c, idx) {
      const cnt = (ctx.itemsList || []).filter(function (i) { return i.cat === c.cat; }).length;
      rows2.push([mkC(idx + 1, 'n', stTdC), mkC(c.cat, 's', stTdR), mkC(cnt, 'n', stTdNum), mkC((c.pct || 0) / 100, 'n', stPctCell(c.pct, true))]);
      rowH2.push({ hpt: 21 });
    });
  } else {
    addFullRow2('لا تتوفر بيانات تفصيلية للأقسام في هذا النطاق.', stMeta, 22);
  }

  rows2.push([]); rowH2.push({ hpt: 14 });
  addFullRow2('ثانياً: تفصيل البنود الأربعة عشر (مرتبة تنازلياً)', stSec, 26);
  rows2.push([mkC('م', 's', stThC), mkC('البند', 's', stThR), mkC('القسم', 's', stThC), mkC('نسبة التنفيذ', 's', stThC)]);
  rowH2.push({ hpt: 24 });

  if (ctx.itemsList && ctx.itemsList.length) {
    ctx.itemsList.slice().sort(function (a, b) { return b.pct - a.pct; }).forEach(function (it, idx) {
      rows2.push([mkC(idx + 1, 'n', stTdC), mkC(it.title, 's', stTdR), mkC(it.cat, 's', stTdC), mkC((it.pct || 0) / 100, 'n', stPctCell(it.pct, false))]);
      rowH2.push({ hpt: 21 });
    });
  }

  const ws2 = XLSX.utils.aoa_to_sheet(rows2);
  ws2['!merges'] = merges2;
  ws2['!rows'] = rowH2;
  ws2['!cols'] = [{ wch: 8 }, { wch: 48 }, { wch: 24 }, { wch: 16 }];
  ws2['!views'] = [{ rightToLeft: true }];
  ws2['!pageSetup'] = { orientation: 'landscape', paperSize: 9 };

  /* الورقة 3: الكشف الهيكلي التفصيلي */
  const rows3 = [], merges3 = [], rowH3 = [];
  const nCols3 = 4 + wsDates.length;

  const stBrRow = { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '0F7A43' } }, alignment: { horizontal: 'right', vertical: 'center' }, border: bThin };
  const stBrPct = { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '0F7A43' } }, alignment: { horizontal: 'center', vertical: 'center' }, border: bThin, numFmt: '0%' };
  const stGrpRow = { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: '064E2B' } }, fill: { patternType: 'solid', fgColor: { rgb: 'E3F5EA' } }, alignment: { horizontal: 'right', vertical: 'center' }, border: bThin };

  const r0 = [mkC('الكشف الهيكلي التفصيلي — ' + title, 's', stTitle)];
  const r1 = [mkC('الفترة: ' + ctx.timeLabel + ' | المقياس: ' + rp.mName, 's', stMeta)];
  for (let c = 1; c < nCols3; c++) { r0.push(mkC('', 's', stTitle)); r1.push(mkC('', 's', stMeta)); }
  rows3.push(r0); merges3.push({ s: { r: 0, c: 0 }, e: { r: 0, c: nCols3 - 1 } }); rowH3.push({ hpt: 28 });
  rows3.push(r1); merges3.push({ s: { r: 1, c: 0 }, e: { r: 1, c: nCols3 - 1 } }); rowH3.push({ hpt: 20 });
  rows3.push([]); rowH3.push({ hpt: 10 });

  const hRow3 = [mkC('الهيكل / الوحدة', 's', stThR), mkC('المستوى', 's', stThC), mkC('الأعضاء', 's', stThC)];
  wsDates.forEach(function (w) { hRow3.push(mkC('أسبوع ' + String(w).slice(5), 's', stThC)); });
  hRow3.push(mkC('المتوسط', 's', stThC));
  rows3.push(hRow3); rowH3.push({ hpt: 25 });

  if (A.role === 'org') {
    const R = A.OR || {}, old_ci = R.ci;
    R.ci = ctx.activeCi;
    (R.branches || []).forEach(function (b) {
      const bSer = oSer(b, A.om || 'exec');
      const bAvg = bSer.length ? Math.round(bSer.reduce(function (a, v) { return a + v; }, 0) / bSer.length) : 0;
      const bRow = [mkC('فرع: ' + b.name, 's', stBrRow), mkC('فرع', 's', stBrPct), mkC(b.n || 0, 'n', stBrPct)];
      bSer.forEach(function (p) { bRow.push(mkC((Number(p) || 0) / 100, 'n', stBrPct)); });
      bRow.push(mkC(bAvg / 100, 'n', stBrPct));
      rows3.push(bRow); rowH3.push({ hpt: 23 });

      const bgs = (R.groups || []).filter(function (g) { return g.branch_id === b.id; });
      bgs.forEach(function (g) {
        const gSer = oSer(g, A.om || 'exec');
        const gAvg = gSer.length ? Math.round(gSer.reduce(function (a, v) { return a + v; }, 0) / gSer.length) : 0;
        const gRow = [mkC('   ↳ مجموعة: ' + g.name + (g.has_sup === false ? ' (بلا مشرف)' : ''), 's', stTdR), mkC('مجموعة', 's', stTdC), mkC(g.n || 0, 'n', stTdNum)];
        gSer.forEach(function (p) { gRow.push(mkC((Number(p) || 0) / 100, 'n', stPctCell(p, false))); });
        gRow.push(mkC(gAvg / 100, 'n', stPctCell(gAvg, true)));
        rows3.push(gRow); rowH3.push({ hpt: 20 });
      });
    });
    R.ci = old_ci;
  } else {
    const x = wrIdx(), old_rci = A.rci;
    A.rci = ctx.activeCi;
    (A.R.groups || []).forEach(function (g) {
      const ms = x.mg[g.id] || [];
      const gSer = wrSer(ms, A.rm || 'exec');
      const gAvg = gSer.length ? Math.round(gSer.reduce(function (a, v) { return a + v; }, 0) / gSer.length) : 0;
      const gRow = [mkC('مجموعة: ' + g.name, 's', stGrpRow), mkC('مجموعة', 's', stGrpRow), mkC(ms.length, 'n', stGrpRow)];
      gSer.forEach(function (p) { gRow.push(mkC((Number(p) || 0) / 100, 'n', stPctCell(p, true))); });
      gRow.push(mkC(gAvg / 100, 'n', stPctCell(gAvg, true)));
      rows3.push(gRow); rowH3.push({ hpt: 22 });

      ms.forEach(function (m, idx) {
        const mSer = wrSer([m], A.rm || 'exec');
        const mAvg = mSer.length ? Math.round(mSer.reduce(function (a, v) { return a + v; }, 0) / mSer.length) : 0;
        const mRow = [mkC('   ' + (idx + 1) + '. ' + m.name, 's', stTdR), mkC('عضو', 's', stTdC), mkC(1, 'n', stTdC)];
        mSer.forEach(function (p) { mRow.push(mkC((Number(p) || 0) / 100, 'n', stPctCell(p, false))); });
        mRow.push(mkC(mAvg / 100, 'n', stPctCell(mAvg, false)));
        rows3.push(mRow); rowH3.push({ hpt: 20 });
      });
    });
    A.rci = old_rci;
  }

  const ws3 = XLSX.utils.aoa_to_sheet(rows3);
  ws3['!merges'] = merges3;
  ws3['!rows'] = rowH3;
  ws3['!cols'] = [{ wch: 40 }, { wch: 14 }, { wch: 12 }].concat(wsDates.map(function () { return { wch: 13 }; })).concat([{ wch: 14 }]);
  ws3['!views'] = [{ rightToLeft: true, state: 'frozen', ySplit: 4 }];
  ws3['!pageSetup'] = { orientation: 'landscape', paperSize: 9 };

  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws1, 'الخلاصة');
  XLSX.utils.book_append_sheet(wb, ws2, 'الأقسام والبنود');
  XLSX.utils.book_append_sheet(wb, ws3, 'الكشف الهيكلي');

  const safeName = String(title).replace(/[\\/:*?"<>|«»]/g, '').replace(/\s+/g, '_').slice(0, 38) || 'متابعة';
  XLSX.writeFile(wb, 'متابعة_' + safeName + '_' + todayStr() + '.xlsx');
}

/* محرك تقرير الـ PDF التنفيذي بتخطيط أفقي عريض (A4 Landscape) */
function repExportPDF(sourceMode) {
  const ctx = getExportContext(sourceMode);
  const rp = ctx.rp, title = ctx.title, totN = ctx.totN, wsDates = rp.ws || [], sel = ctx.selChart || 'all';
  const showAll = (sel === 'all');
  const nowStamp = todayStr() + ' ' + new Date().toTimeString().slice(0, 5);
  const rs = (rp.rows || []).slice().map(function (r) {
    const avg = r.s.length ? Math.round(r.s.reduce(function (a, b) { return a + b; }, 0) / r.s.length) : 0;
    return { r: r, avg: avg };
  }).sort(function (a, b) { return b.avg - a.avg; });
  const sentAvg = ctx.sentSer.length ? Math.round(ctx.sentSer.reduce(function (a, b) { return a + b; }, 0) / ctx.sentSer.length) : 0;

  const badgeCol = function (p) {
    return p >= 75 ? 'background:#e3f5ea;color:#0b6b3a' : p >= 50 ? 'background:#fdf3d8;color:#8a5a00' : 'background:#fbeae6;color:#b3402a';
  };
  const barCol = function (p) {
    return p >= 75 ? '#1f7a4d' : p >= 50 ? '#d99a00' : '#b3402a';
  };

  /* 1) مسار الصعود والهبوط الأسبوعي */
  let trendHtml = '';
  if ((showAll || sel === 'trend') && wsDates.length) {
    trendHtml = '<div class="sec-box page-break-avoid"><div class="sec-title">تطور المستوى الأسبوعي — الصعود والهبوط عبر الأسابيع (' + esc(title) + ')</div>' +
      svgWeeklyProgression(wsDates, rp.ser, ctx.sentSer, rp.mName, title) + '</div>';
  }

  /* 2) رسم الأعمدة العمودية للمقارنة (يتسع لعشرات الفروع بفضل الاتجاه الأفقي Landscape) */
  let colsChartHtml = '';
  if ((showAll || sel === 'cols') && rs.length) {
    const topUnits = rs.slice(0, 22);
    colsChartHtml = '<div class="sec-box page-break-avoid"><div class="sec-title">الرسم البياني العمودي — مقارنة الوحدات (' + esc(ctx.timeLabel) + ')</div>' +
      '<div style="display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:195px;padding:22px 10px 8px;border-bottom:2px solid #cbd5e1;direction:rtl">' +
      topUnits.map(function (item) {
        const p = Math.max(0, Math.min(100, Number(item.avg) || 0));
        const hPx = Math.max(6, Math.round(p * 1.45));
        return '<div style="flex:1;max-width:64px;text-align:center">' +
          '<div style="font-weight:700;font-size:10.5px;color:#064e2b;margin-bottom:3px">' + p + '%</div>' +
          '<div style="height:' + hPx + 'px;background:' + barCol(p) + ';border-radius:5px 5px 0 0;margin:0 auto;width:70%"></div>' +
          '</div>';
      }).join('') + '</div>' +
      '<div style="display:flex;justify-content:space-around;gap:8px;padding-top:6px;direction:rtl">' +
      topUnits.map(function (item) {
        const r = item.r;
        const n = r.u.ms ? r.u.ms.length : (r.u.u ? r.u.u.n : 0);
        return '<div style="flex:1;max-width:64px;text-align:center;font-size:9.5px;color:#334155;font-weight:600;line-height:1.25">' + esc(r.name || r.u.name) + '<div style="color:#64748b;font-weight:400">(' + n + ')</div></div>';
      }).join('') + '</div></div>';
  }

  /* 3) رسم الأشرطة الجانبية الأفقية للمقارنة */
  let hbarsChartHtml = '';
  if ((showAll || sel === 'hbars') && rs.length) {
    hbarsChartHtml = '<div class="sec-box page-break-avoid"><div class="sec-title">الأشرطة الجانبية الأفقية — ترتيب الوحدات (' + esc(ctx.timeLabel) + ')</div>' +
      rs.map(function (item, idx) {
        const r = item.r, p = Math.max(0, Math.min(100, Number(item.avg) || 0));
        const n = r.u.ms ? r.u.ms.length : (r.u.u ? r.u.u.n : 0);
        return '<div style="display:flex;align-items:center;gap:10px;margin:4px 0;font-size:11px">' +
          '<div style="width:22px;color:#64748b;font-weight:700">' + (idx + 1) + '.</div>' +
          '<div style="width:200px;font-weight:700;color:#1e293b">' + esc(r.name || r.u.name) + ' <span style="color:#64748b;font-weight:400;font-size:10px">(' + n + ' عضو)</span></div>' +
          '<div style="flex:1;height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div style="height:100%;width:' + p + '%;background:' + barCol(p) + ';border-radius:99px"></div></div>' +
          '<div style="width:50px;text-align:left;font-weight:700;direction:ltr;color:#064e2b">' + p + '%</div></div>';
      }).join('') + '</div>';
  }

  /* 4) دائرة الإرسال + مقارنة الفترات */
  let midRowHtml = '';
  if (showAll || sel === 'donut' || sel === 'periods') {
    const boxes = [];
    if (showAll || sel === 'donut') {
      const avgSentCnt = Math.round(totN * sentAvg / 100);
      boxes.push('<div class="sec-box" style="margin-bottom:0;flex:1"><div class="sec-title">حالة الإرسال (' + esc(ctx.timeLabel) + ')</div>' + svgDonut(sentAvg, avgSentCnt, totN) + '</div>');
    }
    if ((showAll || sel === 'periods') && ctx.periodStats && ctx.periodStats.length) {
      boxes.push('<div class="sec-box" style="margin-bottom:0;flex:2"><div class="sec-title">مقارنة الفترات الشهرية (الأشهر)</div>' +
        '<table><thead><tr><th>الفترة</th><th>النطاق الزمني</th><th>الأسابيع</th><th>متوسط ' + esc(rp.mName) + '</th><th>متوسط الإرسال</th></tr></thead><tbody>' +
        ctx.periodStats.map(function (ps) {
          return '<tr><td style="font-weight:700">' + esc(ps.label) + '</td><td style="text-align:center;direction:ltr">' + esc(ps.range) + '</td><td style="text-align:center">' + ps.weeks + '</td>' +
            '<td style="text-align:center;font-weight:700;' + badgeCol(ps.pct) + '">' + ps.pct + '%</td><td style="text-align:center">' + ps.sentPct + '%</td></tr>';
        }).join('') + '</tbody></table></div>');
    }
    if (boxes.length) midRowHtml = '<div style="display:flex;gap:12px;align-items:stretch;margin-bottom:14px" class="page-break-avoid">' + boxes.join('') + '</div>';
  }

  /* 5) الأقسام الخمسة والبنود الـ14 */
  let distHtml = '';
  if ((showAll || sel === 'cats') && ctx.catsList && ctx.catsList.length) {
    distHtml += '<div class="sec-box page-break-avoid"><div class="sec-title">توزيع الأداء حسب الأقسام الخمسة (' + esc(ctx.timeLabel) + ')</div>' +
      ctx.catsList.map(function (c) {
        const p = Math.max(0, Math.min(100, Number(c.pct) || 0));
        return '<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:11px">' +
          '<div style="width:180px;font-weight:600;color:#1e293b">' + esc(c.cat) + '</div>' +
          '<div style="flex:1;height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div style="height:100%;width:' + p + '%;background:' + barCol(p) + ';border-radius:99px"></div></div>' +
          '<div style="width:50px;text-align:left;font-weight:700;direction:ltr;color:#064e2b">' + p + '%</div></div>';
      }).join('') + '</div>';
  }
  if ((showAll || sel === 'items') && ctx.itemsList && ctx.itemsList.length) {
    distHtml += '<div class="sec-box page-break-avoid"><div class="sec-title">تفصيل البنود الأربعة عشر (' + esc(ctx.timeLabel) + ' — مرتبة تنازلياً)</div>' +
      ctx.itemsList.slice().sort(function (a, b) { return b.pct - a.pct; }).map(function (it, idx) {
        const p = Math.max(0, Math.min(100, Number(it.pct) || 0));
        return '<div style="display:flex;align-items:center;gap:10px;margin:4px 0;font-size:10.5px">' +
          '<div style="width:22px;color:#64748b;font-weight:700">' + (idx + 1) + '.</div>' +

/* بطاقة استعراض أسبوع سابق بالتفصيل (الأعضاء + طريقة التحضير + البنود الـ14 لذلك الأسبوع) */

    const ro = !!((m.ro || [])[selIdx]);
    const pct = Math.round(100 * done / ti);
    if (sent) {
      sentCnt++;
      sumDone += done;
      if (src === 'group') grpSrcCnt++; else selfSrcCnt++;
    }
    if (ro) roCnt++;
    const gObj = x.gby[m.gid];
    return { m: m, gName: gObj ? gObj.name : '—', sent: sent, done: done, pct: pct, src: src, ro: ro };
  }).sort(function (a, b) {
    if (a.sent !== b.sent) return a.sent ? -1 : 1;
    return b.pct - a.pct;
  });

  const execPct = ms.length ? Math.round(100 * sumDone / (ms.length * ti)) : 0;
  const sentPct = ms.length ? Math.round(100 * sentCnt / ms.length) : 0;

  /* حساب نسب البنود الـ 14 في هذا الأسبوع المحدد */
  const gids = (sc && sc.gids && sc.gids.length) ? sc.gids : Object.keys(x.mg).map(Number);
  let den = 0;

          }).join('') +

      '<div class="grow" style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;text-align:center"><div class="muted">تحضير جماعي مقابل ذاتي</div><b style="font-size:1rem;color:#9a6b00">جماعي: ' + grpSrcCnt + ' · ذاتي: ' + selfSrcCnt + (roCnt ? ' · بإذن: ' + roCnt : '') + '</b></div>' +
    '</div>' +

    '<div class="scroll" style="max-height:380px"><table><thead><tr><th>م</th><th>العضو</th>' + (A.role === 'branch' ? '<th>المجموعة</th>' : '') + '<th>الحالة</th><th>طريقة الرفع</th><th>البنود المنجزة</th><th>نسبة التنفيذ</th></tr></thead><tbody>';

  memberRows.forEach(function (r, idx) {

    h += '<tr><td>' + (idx + 1) + '</td><td><b>' + esc(r.m.name) + '</b></td>' +

      }).join('') + '</tbody></table></div></details>';
  }

  h += '</div>';
  return h;

  const histBar = renderPrepHistoryBar(d.week);

  }

  });
  const act = ms.filter(function (m) { return d.sel[m.id]; });

  while (k < 10 && !uniq()) k++;

var wk6OldPaint = wkPaint;
wkPaint = function () {
  wk6OldPaint();
  var f = document.getElementById('wk6f');
  if (f && WKS) {
    var y = 0; WKS.items.forEach(function (i) { if (WKS.a[i.id] === true) y++; });
    f.style.width = (WKS.items.length ? Math.round(100 * y / WKS.items.length) : 0) + '%';
  }
};

async function week(w) {
  show(loading);
  try {
    var d = await rpc('my_weeks', { p_code: S.code });
    WKD = d;
    var tw = w || d.current;
    if (!tw) { wkRenderList(d); return; }
    wkSeenAdd(tw);
    wkRenderWeek(await rpc('my_week', { p_code: S.code, p_week: tw }));
  } catch (e) { if (String(e.message) === 'bad_code') { localStorage.removeItem('code'); S.code = ''; return login('الرمز غير صحيح أو معطّل.'); } if (String(e.message) === 'no_period') { show('<div class="card"><b>لا توجد فترة متابعة مفتوحة الآن.</b><p class="muted">انتهت فترة المتابعة أو لم تبدأ بعد. تواصل مع مسؤولك ليحدّد الفترة التالية.</p></div>'); return; } show(errBox(e, 'week()')); }
}
</script>

<script>/* == ver_v1 == */
(function () {
  try {
    var m = document.querySelector('meta[name="build"]'); if (!m) return;
    var cur = m.content;
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:4px;left:6px;font:11px sans-serif;color:#7a8f82;z-index:5;direction:ltr';
    b.textContent = 'build ' + cur; document.body.appendChild(b);
    fetch(location.pathname + '?c=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var x = t.match(/name="build" content="([^"]+)"/);
        if (x && x[1] !== cur) {
          var n = document.createElement('div');
          n.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ee8a1f;color:#fff;text-align:center;padding:10px;font:700 14px sans-serif;z-index:99;cursor:pointer';
          n.textContent = '🔄 يوجد إصدار أحدث — اضغط هنا للتحديث';
          n.onclick = function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); };
          document.body.appendChild(n);
        }
      }).catch(function () {});
  } catch (e) {}
})();
