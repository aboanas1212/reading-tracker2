</script><script src="config.js"></script>
<script>
/* ============ أدوات عامة ============ */
const CFG = window.CONFIG || {};
const S = { code: localStorage.getItem('code') || '', me: null, ls: [] };
const A = { pass: sessionStorage.getItem('apass') || '', data: null, tab: 'report' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = h => { document.getElementById('app').innerHTML = h; window.scrollTo(0, 0); };
const loading = '<p class="muted">جارٍ التحميل…</p>';
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const todayStr = () => new Date().toISOString().slice(0, 10);

async function rpc(fn, args) {
  const h = { 'Content-Type': 'application/json', 'apikey': CFG.key };
  if (CFG.key && CFG.key.startsWith('eyJ')) h['Authorization'] = 'Bearer ' + CFG.key;
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args || {}) });
  const t = await r.text(); let d = null;
  try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
  if (!r.ok) throw new Error((d && d.message) || ('http_' + r.status));
  return d;
}
function msg(e) {
  const m = String((e && e.message) || e);
  if (m.startsWith('too_early')) return 'لم يمضِ الوقت الأدنى للقراءة بعد.';
  if (m === 'bad_code') return 'الرمز غير صحيح أو معطّل.';
  if (m === 'bad_admin') return 'كلمة مرور المسؤول غير صحيحة.';
  if (m === 'not_leader') return 'هذه الميزة للمشرفين فقط.';
  if (m === 'no_lesson') return 'الدرس غير موجود.';
  if (m.startsWith('http_') || m.includes('Failed to fetch')) return 'تعذّر الاتصال بالخادم. تحقق من الإنترنت أو من إعدادات config.js.';
  return 'حدث خطأ: ' + m;
}
const errBox = (e, retry) => '<div class="err">' + esc(msg(e)) + '</div>' + (retry ? '<button onclick="' + retry + '">إعادة المحاولة</button>' : '');

/* ============ التوجيه ============ */
/* == brand_v1 == */
(function () {
  const mk = () => {
    const a = document.getElementById('app'); if (!a || document.getElementById('brandbar')) return;
    const d = document.createElement('div'); d.id = 'brandbar'; d.className = 'brandbar noprint';
    d.innerHTML = '<svg viewBox="0 0 48 48" width="46" height="46"><defs><linearGradient id="bglg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22a861"/><stop offset="1" stop-color="#064e2b"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#bglg)"/><path d="M24 15c-4-2.5-9-2.8-13-1.5v20c4-1.3 9-1 13 1.5 4-2.5 9-2.8 13-1.5v-20c-4-1.3-9-1-13 1.5z" fill="#fff"/><path d="M24 15v20" stroke="#0f7a43" stroke-width="1.6"/><circle cx="37" cy="12" r="4.2" fill="#ee8a1f"/></svg>' +
      '<div><div class="bbt">متابعة القراءة</div><div class="bbs">إثبات القراءة والمتابعة الأسبوعية</div></div>';
    a.parentNode.insertBefore(d, a);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mk); else mk();
})();
function brandStat(cls, n, t) { return '<div class="bst ' + cls + '"><div class="bn">' + n + '</div><div class="bl">' + t + '</div></div>'; }
function statCards(done, tot, today) {
  const late = S.ls.filter(l => !l.done && l.due && l.due < today).length;
  const left = Math.max(0, tot - done - late);
  const pct = tot ? Math.round(100 * done / tot) : 0;
  return '<div class="bstats">' + brandStat('s1', done, 'أنجزتَ') + brandStat('s2', left, 'المتبقي') + brandStat('s3', late, 'متأخر') + '</div>' +
    '<div class="card"><div class="row"><b>رصيدك: ' + pct + '%</b><span class="muted">' + done + ' من ' + tot + ' درساً</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
}
function brandStats(c) {
  const ms = c.perMember || [], n = ms.length;
  const avg = n ? Math.round(ms.reduce((a, m) => a + (m.pct || 0), 0) / n) : 0;
  const late = ms.filter(m => m.late > 0).length;
  const top = ms.filter(m => m.done > 0).slice().sort((a, b) => b.pct - a.pct || b.done - a.done || String(a.name).localeCompare(String(b.name), 'ar')).slice(0, 3);
  let h = '<div class="bstats">' + brandStat('s1', n, 'الأعضاء') + brandStat('s2', avg + '%', 'متوسط الإنجاز') + brandStat('s3', late, 'أعضاء متأخرون') + '</div>';
  if (top.length) {
    const med = ['🥇', '🥈', '🥉'], lb = ['الأول', 'الثاني', 'الثالث'];
    h += '<div class="bpod"><h3>🏆 صدارة المتابعة</h3><div class="bpg">' + top.map((m, i) =>
      '<div class="bpc p' + (i + 1) + '"><div class="bm">' + med[i] + '</div><div class="bsb">' + lb[i] + '</div><div class="bnm">' + esc(m.name) + '</div><div class="bpt">' + m.pct + '%</div><div class="bsb">' + m.done + ' / ' + m.tot + '</div></div>').join('') + '</div></div>';
  }
  return h;
}
/* == member_v1 == */
const _cnt = a => ({ done: a.filter(l => l.done).length, tot: a.length });
function dlBtn(id) {
  const l = (S.ls || []).find(x => x.id === id);
  return (l && l.has_file && l.dl) ? '<div class="row noprint" style="margin:6px 0"><button class="sec sm" onclick="dlFile(' + id + ')">⬇ تحميل الملف الأصلي</button></div>' : '';
}
async function dlFile(id) {
  try {
    const f = await rpc('get_lesson_file', { p_code: S.code, p_lesson: id });
    const bin = atob(f.data), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([u], { type: f.mime })); a.download = f.name; a.click();
  } catch (e) { alert(String(e.message) === 'no_download' ? 'التحميل غير متاح لهذا الدرس.' : msg(e)); }
}
function renderHome() {
  const done = S.ls.filter(l => l.done).length, tot = S.ls.length, today = todayStr();
  let h = '<div class="row"><div class="grow"><h1>أهلاً ' + esc(S.me.name) + '</h1>' +
    (S.me.leader ? '<span class="badge b-wait">مشرف مجموعة' + (S.me.grp ? ' — ' + esc(S.me.grp) : '') + '</span>' : '') +
    '</div><button class="sec sm" onclick="logout()">خروج</button></div>' + statCards(done, tot, today);
  const cs = (S.cs || []).slice();
  if (S.ls.some(l => !l.course_id)) cs.push({ id: 0, title: 'دروس أخرى' });
  if (!tot) h += '<p class="muted">لا توجد دروس منشورة بعد.</p>';
  cs.forEach(c => {
    const a = S.ls.filter(l => (l.course_id || 0) === c.id); if (!a.length) return;
    const k = _cnt(a), pct = Math.round(100 * k.done / k.tot), late = a.filter(l => !l.done && l.due && l.due < today).length;
    h += '<div class="card lesson" onclick="course(' + c.id + ')"><div class="grow"><b>' + esc(c.title) + '</b><div class="muted">' + k.done + ' من ' + k.tot + ' دروس' + (late ? ' · متأخر ' + late : '') + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div><span class="badge ' + (k.done === k.tot ? 'b-ok' : 'b-wait') + '">' + pct + '%</span></div>';
  });
  h += '<div class="card lesson" onclick="week()"><div><b>📋 المتابعة الأسبوعية</b><div class="muted">القيم والأخلاق: ضع علامة على ما طبّقته هذا الأسبوع</div></div><span class="badge b-wait">فتح</span></div>';
  show(h);
}
function course(cid) {
  const c = cid ? (S.cs || []).find(x => x.id === cid) : { title: 'دروس أخرى' };
  const a = S.ls.filter(l => (l.course_id || 0) === cid), today = todayStr();
  let h = '<button class="link" onclick="home()">← المواد</button><h2>' + esc(c ? c.title : '') + '</h2>';
  a.forEach(l => {
    const late = !l.done && l.due && l.due < today;
    const b = l.done ? '<span class="badge b-ok">تم' + (l.source === 'group' ? ' (جماعي)' : l.source === 'manual' ? ' (يدوي)' : '') + '</span>'
      : late ? '<span class="badge b-late">متأخر</span>' : '<span class="badge b-wait">لم يُقرأ</span>';
    h += '<div class="card lesson" onclick="lesson(' + l.id + ')"><div><b>' + l.no + '. ' + esc(l.title) + '</b><div class="muted">نحو ' + l.minutes + ' دقيقة' + (l.due ? ' · الموعد ' + esc(l.due) : '') + (l.has_file && l.dl ? ' · ملف للتحميل ⬇' : '') + '</div></div>' + b + '</div>';
  });
  show(h);
}
async function wShift(w, n) { const d = new Date(w + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
async function week(w) {
  show(loading);
  try { renderWeek(await rpc('my_week', { p_code: S.code, p_week: w || null })); }
  catch (e) { show('<button class="link" onclick="home()">← الرئيسية</button>' + errBox(e, 'week()')); }
}

/* == week_v2 == */
function renderWeek(d) {
  const its = d.items || [], cats = [];
  its.forEach(i => { if (!cats.includes(i.cat || '')) cats.push(i.cat || ''); });
  window._wk = { week: d.week, editable: d.editable, n: its.length };

function calc() {
  const d = A.data, today = todayStr(), act = d.members.filter(m => m.active), map = {};
  d.readings.forEach(r => { map[r.m + '_' + r.l] = r; });
  const perLesson = d.lessons.map(l => {
    const n = act.filter(m => map[m.id + '_' + l.id]).length;
    return Object.assign({}, l, { n, total: act.length, pct: act.length ? Math.round(100 * n / act.length) : 0, late: !!(l.due && l.due < today) });
  });
  const perMember = act.map(m => {
    const done = d.lessons.filter(l => map[m.id + '_' + l.id]).length;
    const late = d.lessons.filter(l => l.due && l.due < today && !map[m.id + '_' + l.id]).length;
    const mine = d.readings.filter(r => r.m === m.id).map(r => r.t).sort();
    return Object.assign({}, m, { done, late, tot: d.lessons.length, pct: d.lessons.length ? Math.round(100 * done / d.lessons.length) : 0, last: mine.length ? mine[mine.length - 1].slice(0, 10) : '—' });
  });
  return { map, perLesson, perMember, act };
}

function wCsv() {
  const W = A.W; if (!W) return;

  const rows = [['الأسبوع', W.week], [], ['البند', 'نفّذ', 'لم ينفّذ', 'لم يُجب', 'نسبة التنفيذ']];
  (W.items || []).forEach(i => rows.push([i.title, i.done, i.no, Math.max(0, TM - i.done - i.no), pctOf(i.done, TM) + '%']));
  rows.push([]);
  rows.push(['العضو', 'أجاب عن', 'نفّذ', 'من إجمالي البنود', 'نسبة التعبئة']);
  (W.members || []).forEach(m => rows.push([m.name, m.answered, m.done, TI, pctOf(m.answered, TI) + '%']));
  const t = '\uFEFF' + rows.map(r => r.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');

function tWeek() {
  if (!A.W) { loadW(); return '<p class="muted">جارٍ تحميل المتابعة الأسبوعية…</p>'; }
  const W = A.W, TM = W.total_members || 0, TI = W.total_items || 0;
  const ws = (W.weeks || []).slice();
  if (W.week && ws.indexOf(W.week) < 0) ws.unshift(W.week);
  let h = '<div class="card"><div class="row"><div class="grow"><b>📋 المتابعة الأسبوعية</b><div class="muted">الأعضاء النشطون: ' + TM + ' · البنود: ' + TI + '</div></div>' +

    '<button class="sec sm" onclick="wCsv()">تصدير CSV</button></div></div>';
  if (!TI || !TM) return h + '<p class="muted">لا توجد بنود أو أعضاء نشطون بعد.</p>';
  h += '<h3>نسبة تنفيذ كل بند</h3><div class="scroll"><table><tr><th>#</th><th>البند</th><th>نفّذ</th><th>لم ينفّذ</th><th>لم يُجب</th><th>النسبة</th><th></th></tr>';

    const na = Math.max(0, TM - i.done - i.no), p = pctOf(i.done, TM);

  });
  h += '</table></div>';
  const ms = (W.members || []).slice().sort((a, b) => a.answered - b.answered || a.name.localeCompare(b.name, 'ar'));
  h += '<h3>تعبئة كل عضو (الأقل تعبئة أولاً)</h3><div class="scroll"><table><tr><th>العضو</th><th>أجاب عن</th><th>نفّذ</th><th>التعبئة</th><th></th></tr>';
  ms.forEach(m => {

function wkChart(weeks) {
