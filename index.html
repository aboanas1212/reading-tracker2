    '.wk3-row{margin:0;border:1px solid var(--line);border-top:0;border-radius:0;box-shadow:none;padding:7px 14px;gap:12px;background:#fff}',
    '.wk3-row[data-on="1"]{background:#eef8f1;border-right:1px solid var(--line)}',
    '.wk3-cat{margin:0;padding:8px 14px;background:#f1f6f2;border:1px solid var(--line);border-top:0;font-size:.86rem}',
    '.wk3-prog + .wk3-cat,.wk3-prog + .wk3-row{border-top:1px solid var(--line);border-radius:14px 14px 0 0;margin-top:10px}',
    '.wk3-sp{border-top:1px solid var(--line);height:130px}',
    '.wk3-no{order:0;width:22px;font-size:.74rem}',
    '.wk3-tx{order:1;font-size:.86rem;line-height:1.4}',
    '.wk3-ck{order:2;width:28px;height:28px;font-size:.95rem;border-width:2px;margin-right:auto}',
    '.wk3-ic{display:none}'
  ].join('');
  document.head.appendChild(st);
})();
</script>
<script>/* == weekui_v6 == */
var WKD = null;
(function () {
  var st = document.createElement('style');
  st.setAttribute('data-id', 'weekui_v6');
  st.textContent = [
    'body .wk3-row{margin:9px 0;border:1px solid #d3e3d9;border-bottom:4px solid #b9d2c1;border-radius:14px;padding:11px 14px;background:linear-gradient(180deg,#fff,#f3f9f5);box-shadow:0 7px 14px rgba(6,78,43,.15),0 1px 0 #fff inset;transition:transform .12s,box-shadow .12s,background .18s,border-color .18s}',
    'body .wk3-row:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(6,78,43,.18);border-bottom-width:2px}',
    'body .wk3-row[data-ro="1"]:active{transform:none}',
    'body .wk3-row[data-on="1"]{background:linear-gradient(180deg,#f0fbf4,#d6efe0);border-color:#7cc597;border-bottom-color:#2f9a5f;border-right:1px solid #7cc597}',
    'body .wk3-ck{width:32px;height:32px;font-size:1rem;box-shadow:inset 0 2px 4px rgba(0,0,0,.13)}',
    'body .wk3-row[data-on="1"] .wk3-ck{box-shadow:0 3px 7px rgba(6,78,43,.35)}',

    'body .wk3-prog{position:static;margin:18px 0 10px}',
    '.wk6-h{font-size:1.15rem;margin:6px 0}',
    '.wk6-mini{height:6px;background:#e4efe7;border-radius:4px;overflow:hidden;max-width:760px;margin:0 auto 8px}',
    '.wk6-mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22a861,#064e2b);transition:width .25s}'
  ].join('');
  document.head.appendChild(st);
})();

function wk6Below(d) {
  var el = document.getElementById('wk6below');
  if (!el || !d) return;
  var ws = d.weeks || [], h = '';
  if (d.streak > 0) h += '<div class="card wk-streak">سلسلة الإرسال المتتالي: <b>' + wkWord(d.streak) + '</b>. استمر.</div>';
  h += '<div class="card"><b>تطوّر نسبة تنفيذك</b>' + wkChart(ws) + '</div>';
  h += wkCompare(d.compare);
  h += '<h3>الأسابيع</h3>' + wkList(ws, d.current);
  el.innerHTML = h;
}

function wkRenderWeek(d) {
  var its = d.items || [], a = {}, valid = {};
  its.forEach(function (i) { valid[i.id] = 1; if (i.ans && i.on) a[i.id] = true; });
  var ed = !!d.editable;
  var dr = ed ? wkLoad(d.week) : null;
  if (dr && dr.a) Object.keys(dr.a).forEach(function (k) { if (valid[k]) { if (dr.a[k]) a[k] = true; else delete a[k]; } });
  var cats = [];
  its.forEach(function (i) { var c = i.cat || ''; if (cats.indexOf(c) < 0) cats.push(c); });
  WKS = { week: d.week, editable: ed, items: its, a: a, cats: cats };
  var tot = its.length, cur = d.week === d.current;
  var h = '<button class="link" onclick="' + (cur ? 'home()' : 'week()') + '">' + (cur ? '← الرئيسية' : '← الأسبوع الحالي') + '</button><h2 class="wk6-h">أسبوع يبدأ السبت ' + esc(d.week) + (cur ? ' (الحالي)' : '') + '</h2>';
  if (d.submitted) h += '<div class="wk3-note ok3">أُرسل هذا الأسبوع ولا يمكن تغيير إجاباته.</div>';
  else if (!ed) h += '<div class="wk3-note">انتهت مدة الإجابة عن هذا الأسبوع، وهو للاطلاع فقط.</div>';
  else h += '<div class="wk3-note">اضغط البند لتحديده «نفّذتُ». ما يُترك دون تحديد يُحسب «لم أنفّذ». لا يُرسل شيء قبل زر الإرسال.</div>';
  if (!tot) { show(h + '<p class="muted">لم تُضَف بنود المتابعة بعد.</p>'); return; }
  var k = 0;
  cats.forEach(function (c, ci) {
    var list = its.filter(function (i) { return (i.cat || '') === c; });
    if (c) h += '<div class="wk3-cat"><span>' + esc(c) + '</span><em data-wk3c="' + ci + '"></em></div>';
    list.forEach(function (i) {
      k++;
      h += '<div class="wk3-row" id="wki' + i.id + '" role="checkbox" aria-checked="false" data-on="0"' +
        (ed ? ' tabindex="0" onclick="wkSet(' + i.id + ')" onkeydown="wk3Key(event,' + i.id + ')"' : ' data-ro="1"') + '>' +
        '<div class="wk3-ck">✓</div><div class="wk3-tx">' + esc(i.title) + '</div><div class="wk3-no">' + k + '</div></div>';
    });
  });
  var seg = ''; for (var s = 0; s < tot; s++) seg += '<i></i>';
  h += '<div class="wk3-prog" id="wk3prog"><div class="wk3-ph"><div><b id="wk3n">0</b><span class="wk3-of"> / ' + tot + '</span></div><span id="wk3t" class="wk3-t2"></span><b id="wk3p" class="wk3-pc">0%</b></div><div class="wk3-seg" id="wk3seg">' + seg + '</div></div>';
  h += '<div id="wk6below"></div>';
  if (ed) h += '<div class="wk3-sp"></div><div class="wk3-dock"><div id="wkmsg" class="wk-err"></div><div class="wk6-mini"><i id="wk6f"></i></div><div class="wk3-dk"><button class="wk3-s" onclick="wkAll(true)">✓ الكل</button><button class="wk3-s" onclick="wkAll(null)">↺ مسح</button><button id="wksend" class="wk3-go" onclick="wkAsk()">إرسال</button></div></div>';
  else h += '<div class="wk3-sp"></div>';
  show(h); wkPaint();
  if (cur && WKD) wk6Below(WKD);
}

var wk6OldPaint = wkPaint;
wkPaint = function () {
  wk6OldPaint();
  var f = document.getElementById('wk6f');
  if (f && WKS) {
    var y = 0; WKS.items.forEach(function (i) { if (WKS.a[i.id] === true) y++; });
    f.style.width = (WKS.items.length ? Math.round(100 * y / WKS.items.length) : 0) + '%';
  }
};

async function week(w) {
  show(loading);
  try {
    var d = await rpc('my_weeks', { p_code: S.code });
    WKD = d;
    var tw = w || d.current;
    if (!tw) { wkRenderList(d); return; }
    wkSeenAdd(tw);
    wkRenderWeek(await rpc('my_week', { p_code: S.code, p_week: tw }));
  } catch (e) { if (String(e.message) === 'bad_code') { localStorage.removeItem('code'); S.code = ''; return login('الرمز غير صحيح أو معطّل.'); } show(errBox(e, 'week()')); }
}
</script>

<script>/* == ver_v1 == */
(function () {
  try {
    var m = document.querySelector('meta[name="build"]'); if (!m) return;
    var cur = m.content;
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:4px;left:6px;font:11px sans-serif;color:#7a8f82;z-index:5;direction:ltr';
    b.textContent = 'build ' + cur; document.body.appendChild(b);
    fetch(location.pathname + '?c=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var x = t.match(/name="build" content="([^"]+)"/);
        if (x && x[1] !== cur) {
          var n = document.createElement('div');
          n.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ee8a1f;color:#fff;text-align:center;padding:10px;font:700 14px sans-serif;z-index:99;cursor:pointer';
          n.textContent = '🔄 يوجد إصدار أحدث — اضغط هنا للتحديث';
          n.onclick = function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); };
          document.body.appendChild(n);
        }
      }).catch(function () {});
  } catch (e) {}
})();
</script>
